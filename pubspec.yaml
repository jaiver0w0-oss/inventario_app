name: inventario_app
description: "Sistema de Gestión de Inventario"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  share_plus: ^10.0.0
  cupertino_icons: ^1.0.6
  gsheets: ^0.5.0
  http: ^1.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.3   # Para acceder al directorio temporal del teléfono
  docx_template: ^0.4.0   # Para procesar y sustituir etiquetas en el archivo Word

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/plantilla_reporte.docx   # Registro de la plantilla en Word